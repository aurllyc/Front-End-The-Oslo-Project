# Salin file ini ke root project sebagai: .gitlab-ci.yml
# Tugas GitLab hanya mirror ke GitHub. Build & deploy di GitHub Actions.

stages:
  - mirror

mirror-to-github:
  stage: mirror
  image: alpine:3.19

  only:
    - production
    - staging
    - development

  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh
    - echo "$GITHUB_DEPLOY_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts

  script:
    - git remote add github git@github.com:$GITHUB_REPO.git 2>/dev/null || true
    - git push github HEAD:$CI_COMMIT_REF_NAME --force

  after_script:
    - rm -f ~/.ssh/id_ed25519
